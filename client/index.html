<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>FurniSelect | Thoughtful Furniture for Modern Living</title>

    <meta
        name="description"
        content="Shop thoughtful furniture for modern living. Discover sofas, tables, chairs and home accents with curated collections and AI-powered room recommendations from FurniSelect."
    />

    <meta
        name="keywords"
        content="modern furniture, wooden furniture, home furniture, sofas, dining tables, bedroom furniture, home decor, AI interior design, FurniSelect"
    />

    <meta name="author" content="Om Bhalla" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#9a6038" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta
        property="og:title"
        content="FurniSelect | Thoughtful Furniture for Modern Living"
    />

    <meta
        property="og:description"
        content="Thoughtful furniture, curated for modern homes, with AI-powered room recommendations."
    />

    <meta
        property="og:image"
        content="https://furniselect-ai.vercel.app/thumbnail.png"
    />

    <meta
        property="og:url"
        content="https://furniselect-ai.vercel.app/"
    />

    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta
        name="twitter:card"
        content="summary_large_image"
    />

    <meta
        name="twitter:title"
        content="FurniSelect | Thoughtful Furniture for Modern Living"
    />

    <meta
        name="twitter:description"
        content="Thoughtful furniture, curated for modern homes, with AI-powered room recommendations."
    />

    <meta
        name="twitter:image"
        content="https://furniselect-ai.vercel.app/thumbnail.png"
    />

    <!-- Canonical URL -->
    <link
        rel="canonical"
        href="https://furniselect-ai.vercel.app/"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FurniSelect",
      "url": "https://furniselect-ai.vercel.app/",
      "description": "AI-powered furniture marketplace with smart recommendations.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://furniselect-ai.vercel.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>

<body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
